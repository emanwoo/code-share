<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<title>수업 코드 공유</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #5b6475;
    --line: #dde1e8;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --tab-bg: #e9edf3;
    --code-bg: #fbfcfd;
    --gutter: #9aa3b2;
    --ok: #1a8a4a;
    --ok-text: #ffffff;
    --tk-keyword: #b5179e;
    --tk-string: #2a7d2e;
    --tk-number: #c25e00;
    --tk-comment: #7b8494;
    --tk-title: #2457d6;
    --tk-builtin: #0b7a8f;
    --fs: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #a0a8b8; --line: #2e3440;
      --accent: #5b8cff; --accent-text: #0d1117; --tab-bg: #252a34; --code-bg: #161a21;
      --gutter: #5d6575; --ok: #4cc77f; --ok-text: #0d1117;
      --tk-keyword: #ff7ad9; --tk-string: #8fd18f; --tk-number: #ffb067; --tk-comment: #7d8697;
      --tk-title: #82aaff; --tk-builtin: #5fd3e6;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ok-text: #0d1117;
    --bg: #14171d;
    --panel: #1c2028;
    --text: #e6e9ef;
    --muted: #a0a8b8;
    --line: #2e3440;
    --accent: #5b8cff;
    --accent-text: #0d1117;
    --tab-bg: #252a34;
    --code-bg: #161a21;
    --gutter: #5d6575;
    --ok: #4cc77f;
    --tk-keyword: #ff7ad9;
    --tk-string: #8fd18f;
    --tk-number: #ffb067;
    --tk-comment: #7d8697;
    --tk-title: #82aaff;
    --tk-builtin: #5fd3e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.5;
  }
  /* ---------- 상단 바 ---------- */
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; z-index: 10;
    height: env(safe-area-inset-top, 0px); background: var(--panel);
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .topbar, nav.tabs, main, .stepper {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .topbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-block: 10px;
  }
  .topbar h1 { font-size: 20px; margin: 0; flex: 1 1 auto; }
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--line); background: var(--tab-bg); color: var(--text);
    border-radius: 8px; padding: 6px 12px;
  }
  button:hover { border-color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .size-label { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  /* ---------- 탭 ---------- */
  nav.tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding-block: 0 10px;
    scrollbar-width: thin;
  }
  nav.tabs button {
    white-space: nowrap; font-size: 17px; padding: 8px 16px;
  }
  nav.tabs button[aria-selected="true"] {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700;
  }
  /* ---------- 본문 ---------- */
  main { max-width: 1400px; margin: 0 auto; padding-block: 20px 120px; }
  .panel { min-width: 0; }
  .panel h2 { font-size: calc(var(--fs) * 1.25); margin: 0 0 12px; }
  .panel .desc, .panel p, .panel li { font-size: calc(var(--fs) * 0.85); }
  .panel p { margin: 0 0 14px; }
  .panel code.inline {
    font-family: Consolas, "D2Coding", "Courier New", monospace;
    background: var(--tab-bg); padding: 1px 6px; border-radius: 4px;
  }
  .code-card {
    background: var(--code-bg);
    border: 1px solid var(--line); border-radius: 12px;
    margin: 18px 0 26px; overflow: hidden;
  }
  .code-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .code-name { color: var(--muted); font-size: 16px; font-family: Consolas, monospace; }
  .copy-btn {
    background: var(--accent); color: var(--accent-text); border-color: var(--accent);
    font-weight: 700; font-size: 18px; padding: 8px 20px;
  }
  .copy-btn.done { background: var(--ok); border-color: var(--ok); color: var(--ok-text); }
  .code-body { display: flex; }
  .gutter, .code-body pre {
    margin: 0; padding: 14px 0;
    font-family: Consolas, "D2Coding", "Cascadia Code", "Courier New", monospace;
    font-size: var(--fs); line-height: 1.5;
    white-space: pre; tab-size: 4;
  }
  .gutter {
    color: var(--gutter); text-align: right;
    padding-left: 14px; padding-right: 14px;
    border-right: 1px solid var(--line);
    user-select: none; -webkit-user-select: none;
  }
  .code-body pre { flex: 1; overflow-x: auto; padding-left: 16px; padding-right: 16px; }
  .code-body pre code { font: inherit; background: none; padding: 0; }
  /* 코드 색상 */
  .hljs-keyword, .hljs-literal, .hljs-meta .hljs-keyword { color: var(--tk-keyword); }
  .hljs-string, .hljs-regexp { color: var(--tk-string); }
  .hljs-number { color: var(--tk-number); }
  .hljs-comment { color: var(--tk-comment); font-style: italic; }
  .hljs-title, .hljs-function .hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--tk-title); }
  .hljs-built_in, .hljs-type { color: var(--tk-builtin); }
  .hljs-subst { color: var(--text); }
  /* ---------- 하단 이전/다음 ---------- */
  .stepper {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; justify-content: space-between; gap: 12px;
    padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border-top: 1px solid var(--line);
  }
  .stepper button { font-size: 18px; padding: 10px 18px; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stepper button[disabled] { opacity: .35; cursor: default; }
  /* ---------- QR 창 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.55); align-items: center; justify-content: center; padding: 16px;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #fff; color: #111; border-radius: 16px; padding: 24px; text-align: center; max-width: 100%;
  }
  #qr { display: inline-block; padding: 12px; background: #fff; }
  #qr img, #qr canvas { max-width: 70vmin; height: auto; }
  .url-text { font-size: 22px; word-break: break-all; margin: 12px 0; font-family: Consolas, monospace; }
  .toast {
    position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%);
    background: var(--ok); color: var(--ok-text); padding: 10px 22px; border-radius: 999px;
    font-size: 18px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 600px) {
    .topbar h1 { font-size: 17px; width: 100%; }
    .copy-btn { font-size: 16px; padding: 6px 14px; }
  }
</style>
<style>
  .empty {
    text-align: center; color: var(--muted); padding: 60px 16px;
    font-size: calc(var(--fs) * 0.9);
  }
  .empty b { display: block; font-size: calc(var(--fs) * 1.1); color: var(--text); margin-bottom: 8px; }
  .panel .desc { white-space: pre-wrap; margin: 0 0 14px; }
  nav.tabs button.fresh::after {
    content: "NEW"; margin-left: 6px; font-size: 11px; font-weight: 700;
    background: var(--ok); color: var(--ok-text); border-radius: 6px; padding: 1px 5px; vertical-align: 2px;
  }
  .live {
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .live::before { content: "●"; color: var(--ok); margin-right: 4px; }
  .live.off::before { color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <h1 id="courseTitle">정보 수업 코드</h1>
    <div class="tools">
      <span class="live" id="live" title="선생님이 코드를 공개하면 자동으로 나타납니다">자동 업데이트</span>
      <button id="sizeDown" title="글자 작게 ( - 키 )">가−</button>
      <button id="sizeReset" class="size-label" title="클릭하면 기본 크기로">22px</button>
      <button id="sizeUp" title="글자 크게 ( + 키 )">가+</button>
      <button id="themeBtn" title="밝은/어두운 화면">🌓</button>
      <button id="qrBtn" title="접속 QR 코드 보기">QR</button>
      <button id="fullBtn" title="전체 화면">⛶</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="수업 단계"></nav>
</header>

<main id="main"></main>

<div class="stepper">
  <button id="prevBtn">← 이전</button>
  <button id="nextBtn">다음 →</button>
</div>

<div class="modal" id="qrModal" role="dialog" aria-label="접속 QR 코드">
  <div class="modal-box">
    <div id="qr"></div>
    <div class="url-text" id="qrUrl"></div>
    <button id="qrClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // 수업 내용은 교사 화면(주소 끝에 ?mode=teacher)에서 고칩니다. 이 파일은 고칠 필요가 없습니다.
  const APP_URL = <?= appUrl ?>;
  const INITIAL = <?!= initialJson ?>;
  const DEFAULT_SIZE = 22;                  // 기본 글자 크기(px)
  const MIN_SIZE = 14, MAX_SIZE = 48;
  const POLL_MS = 15000;                    // 새 탭 확인 간격 (15초)
  const GS = (window.google && google.script) ? google.script : null;

  // ---------- 저장(실패해도 동작) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---------- 복사 ----------
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove();
      return ok;
    }
  }

  const toast = document.getElementById("toast");
  let toastTimer;
  function showToast(msg, ms) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), ms || 1800);
  }

  // 코드 끝의 빈 줄, 줄 끝 공백 정리 (들여쓰기는 그대로)
  function tidy(code) {
    const lines = String(code || "").replace(/\r\n?/g, "\n").split("\n").map(l => l.replace(/\s+$/, ""));
    while (lines.length && lines[0] === "") lines.shift();
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  // ---------- 코드 카드 ----------
  function makeCodeCard(c) {
    const code = tidy(c.code);
    const lang = c.lang || "python";
    const card = document.createElement("div");
    card.className = "code-card";

    const head = document.createElement("div");
    head.className = "code-head";
    const label = document.createElement("span");
    label.className = "code-name";
    label.textContent = c.name || lang;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "📋 복사하기";
    btn.addEventListener("click", async () => {
      const ok = await copyText(code);
      if (ok) {
        btn.textContent = "✓ 복사됨";
        btn.classList.add("done");
        showToast("복사되었습니다! 붙여넣기 하세요 (Ctrl+V)");
        setTimeout(() => { btn.textContent = "📋 복사하기"; btn.classList.remove("done"); }, 2000);
      } else {
        showToast("복사 실패 — 코드를 드래그해서 복사하세요");
      }
    });
    head.append(label, btn);

    const body = document.createElement("div");
    body.className = "code-body";
    const gutter = document.createElement("div");
    gutter.className = "gutter";
    gutter.setAttribute("aria-hidden", "true");
    gutter.textContent = code.split("\n").map((_, i) => i + 1).join("\n");
    const pre = document.createElement("pre");
    const codeEl = document.createElement("code");
    codeEl.className = "language-" + lang;
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    body.append(gutter, pre);
    if (window.hljs) { try { hljs.highlightElement(codeEl); } catch (e) {} }

    card.append(head, body);
    return card;
  }

  function makePanel(t) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.setAttribute("role", "tabpanel");
    const h2 = document.createElement("h2");
    h2.textContent = t.title;
    panel.appendChild(h2);
    if (t.desc) {
      const p = document.createElement("p");
      p.className = "desc";
      p.textContent = t.desc;
      panel.appendChild(p);
    }
    (t.codes || []).forEach(c => panel.appendChild(makeCodeCard(c)));
    return panel;
  }

  // ---------- 탭 그리기 ----------
  const tabsEl = document.getElementById("tabs");
  const mainEl = document.getElementById("main");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  let data = { title: "", version: "", tabs: [] };
  let tabs = [], panels = [];
  let current = 0;
  const seen = new Set(JSON.parse(store.get("codeShare.seen", "[]") || "[]"));
  const firstLoad = seen.size === 0;

  function sig(t) { return JSON.stringify([t.title, t.desc, t.codes]); }

  function render(newData, initial) {
    const oldTabs = data.tabs;
    const oldSig = {};
    oldTabs.forEach(t => (oldSig[t.id] = sig(t)));
    const curId = oldTabs[current] && oldTabs[current].id;
    const wasAtEnd = current >= oldTabs.length - 1;

    data = newData;
    const title = data.title || "정보 수업 코드";
    document.getElementById("courseTitle").textContent = title;
    document.title = title;

    tabsEl.innerHTML = "";
    mainEl.innerHTML = "";
    tabs = []; panels = [];

    if (!data.tabs.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      const b = document.createElement("b");
      b.textContent = "아직 공개된 코드가 없습니다";
      empty.append(b, "선생님이 코드를 공개하면 이 화면에 자동으로 나타납니다.");
      mainEl.appendChild(empty);
      prevBtn.disabled = nextBtn.disabled = true;
      prevBtn.textContent = "← 이전"; nextBtn.textContent = "다음 →";
      return { added: [], changedCurrent: false };
    }

    data.tabs.forEach((t, i) => {
      const tab = document.createElement("button");
      tab.setAttribute("role", "tab");
      tab.id = "tab-" + i;
      tab.textContent = t.title;
      if (!firstLoad && !seen.has(t.id)) tab.classList.add("fresh");
      tab.addEventListener("click", () => show(i));
      tabsEl.appendChild(tab);
      tabs.push(tab);
      const panel = makePanel(t);
      panel.setAttribute("aria-labelledby", tab.id);
      panel.hidden = true;
      mainEl.appendChild(panel);
      panels.push(panel);
    });

    if (initial) return { added: [], changedCurrent: false };
    const added = data.tabs.filter(t => !(t.id in oldSig));
    const curNow = data.tabs.find(t => t.id === curId);
    const changedCurrent = !!(curNow && oldSig[curId] !== sig(curNow));

    let target = data.tabs.findIndex(t => t.id === curId);
    if (added.length && wasAtEnd) target = data.tabs.findIndex(t => t.id === added[added.length - 1].id);
    if (target < 0) target = Math.min(current, data.tabs.length - 1);
    show(target, false, target === current && !!curNow);
    return { added, changedCurrent };
  }

  function markSeen(i) {
    const t = data.tabs[i];
    if (!t) return;
    if (tabs[i]) tabs[i].classList.remove("fresh");
    if (!seen.has(t.id)) {
      seen.add(t.id);
      store.set("codeShare.seen", JSON.stringify([...seen]));
    }
  }

  function show(i, fromHash, keepScroll) {
    if (!panels.length) return;
    i = Math.max(0, Math.min(panels.length - 1, i));
    current = i;
    panels.forEach((p, k) => (p.hidden = k !== i));
    tabs.forEach((t, k) => t.setAttribute("aria-selected", String(k === i)));
    tabs[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === panels.length - 1;
    prevBtn.textContent = i > 0 ? "← " + data.tabs[i - 1].title : "← 이전";
    nextBtn.textContent = i < panels.length - 1 ? data.tabs[i + 1].title + " →" : "다음 →";
    markSeen(i);
    if (!fromHash) {
      try {
        if (GS && GS.history) GS.history.replace(null, null, String(i + 1));
        else history.replaceState(null, "", "#" + (i + 1));
      } catch (e) {}
    }
    if (!keepScroll) window.scrollTo(0, 0);
  }

  function indexFrom(hash) {
    const n = parseInt(String(hash || "").replace("#", ""), 10);
    return Number.isFinite(n) ? n - 1 : -1;
  }
  if (GS && GS.history) {
    try { GS.history.setChangeHandler(e => { const n = indexFrom(e.location && e.location.hash); if (n >= 0) show(n, true); }); } catch (e) {}
  } else {
    window.addEventListener("hashchange", () => { const n = indexFrom(location.hash); if (n >= 0) show(n, true); });
  }
  prevBtn.addEventListener("click", () => show(current - 1));
  nextBtn.addEventListener("click", () => show(current + 1));

  // ---------- 자동 업데이트 ----------
  const live = document.getElementById("live");
  let polling = false, failCount = 0;
  function poll() {
    if (!GS || !GS.run || polling || document.hidden) return;
    polling = true;
    GS.run
      .withSuccessHandler(res => {
        polling = false; failCount = 0;
        live.classList.remove("off"); live.textContent = "자동 업데이트";
        if (!res || res.same) return;
        const r = render(res);
        if (r.added.length) showToast("새 코드가 공개되었습니다: " + r.added.map(t => t.title).join(", "), 3500);
        else if (r.changedCurrent) showToast("선생님이 이 탭의 코드를 수정했습니다", 3000);
      })
      .withFailureHandler(() => {
        polling = false; failCount++;
        if (failCount >= 2) { live.classList.add("off"); live.textContent = "연결 끊김"; }
      })
      .getPublicLessons(data.version);
  }
  setInterval(poll, POLL_MS + Math.floor(Math.random() * 4000));
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });

  // ---------- 글자 크기 ----------
  const sizeLabel = document.getElementById("sizeReset");
  let size = parseInt(store.get("codeShare.size", DEFAULT_SIZE), 10) || DEFAULT_SIZE;
  function setSize(s) {
    size = Math.max(MIN_SIZE, Math.min(MAX_SIZE, s));
    document.documentElement.style.setProperty("--fs", size + "px");
    sizeLabel.textContent = size + "px";
    store.set("codeShare.size", size);
  }
  document.getElementById("sizeUp").addEventListener("click", () => setSize(size + 2));
  document.getElementById("sizeDown").addEventListener("click", () => setSize(size - 2));
  sizeLabel.addEventListener("click", () => setSize(DEFAULT_SIZE));

  // ---------- 테마 ----------
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    store.set("codeShare.theme", t);
  }
  const savedTheme = store.get("codeShare.theme", "");
  if (savedTheme) setTheme(savedTheme);
  function isDark() {
    const t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  document.getElementById("themeBtn").addEventListener("click", () => setTheme(isDark() ? "light" : "dark"));

  // ---------- 전체 화면 ----------
  document.getElementById("fullBtn").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => showToast("이 화면에서는 전체 화면을 쓸 수 없습니다"));
  });

  // ---------- QR ----------
  const qrModal = document.getElementById("qrModal");
  document.getElementById("qrBtn").addEventListener("click", () => {
    const url = APP_URL || location.href.split("#")[0];
    const box = document.getElementById("qr");
    box.innerHTML = "";
    document.getElementById("qrUrl").textContent = url;
    if (url && window.QRCode) {
      try { new QRCode(box, { text: url, width: 360, height: 360 }); } catch (e) {}
    }
    qrModal.classList.add("open");
  });
  document.getElementById("qrClose").addEventListener("click", () => qrModal.classList.remove("open"));
  qrModal.addEventListener("click", e => { if (e.target === qrModal) qrModal.classList.remove("open"); });

  // ---------- 키보드 ----------
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") show(current + 1);
    else if (e.key === "ArrowLeft") show(current - 1);
    else if (e.key === "+" || e.key === "=") setSize(size + 2);
    else if (e.key === "-") setSize(size - 2);
    else if (e.key === "Escape") qrModal.classList.remove("open");
  });

  // ---------- 시작 ----------
  setSize(size);
  render(INITIAL || { title: "", version: "", tabs: [] }, true);
  // 처음 열 때는 가장 마지막에 공개된 탭을 보여 줍니다 (주소에 #번호가 있으면 그 탭)
  show(Math.max(0, data.tabs.length - 1), true);
  if (GS && GS.url) {
    try { GS.url.getLocation(loc => { const n = indexFrom(loc && loc.hash); if (n >= 0) show(n, true); }); } catch (e) {}
  } else {
    const n = indexFrom(location.hash);
    if (n >= 0) show(n, true);
  }
</script>
</body>
</html>
